name: OpsMind AI — CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Job 1: Laravel PHPUnit Tests ────────────────────────────────────────────
  laravel-tests:
    name: 🧪 Laravel Tests (PHPUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: php-${{ hashFiles('backend/composer.lock') }}
          restore-keys: php-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy .env for testing
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Tests
        working-directory: backend
        run: php artisan test --testdox --parallel

  # ── Job 2: Python AI Service Tests ──────────────────────────────────────────
  python-tests:
    name: 🐍 Python AI Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ai_service/requirements.txt

      - name: Install Python dependencies
        working-directory: ai_service
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        working-directory: ai_service
        run: python -m pytest tests/ -v --tb=short

  # ── Job 3: Frontend Build Verification ──────────────────────────────────────
  frontend-build:
    name: ⚛️ Frontend Build (TypeScript + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci --frozen-lockfile

      - name: Run TypeScript type check + Vite build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Job 4: Build Docker Images ───────────────────────────────────────────────
  docker-build:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [ laravel-tests, python-tests, frontend-build ]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Laravel image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/opsmind-laravel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Python AI image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          file: ./ai_service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/opsmind-python-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/opsmind-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Deploy to VPS (SSH) ───────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'


    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/opsmind
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker-compose exec -T laravel php artisan migrate --force
            docker-compose exec -T laravel php artisan config:cache
            docker-compose exec -T laravel php artisan route:cache
            docker-compose exec -T laravel php artisan view:cache
            echo "✅ Deployment complete at $(date)"
